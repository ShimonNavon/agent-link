apiVersion: v1
kind: Namespace
metadata: {name: agent-link}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: agent-link
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: agent-link
  labels: {app: agent-link}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: agent-link}
  template:
    metadata:
      labels: {app: agent-link}
      annotations: {agent-link/code: "__CODE_HASH__"}
    spec:
      containers:
        - name: hub
          image: python:3.13-alpine
          command: ["python3", "/app/hub.py"]
          env:
            - {name: PORT, value: "8080"}
            - {name: PUBLIC_URL, value: "http://ubuntu03:30110"}
            - {name: AGENT_LINK_DB, value: /data/link.db}
            - {name: STATIC_DIR, value: /app}
            - {name: ALLOWED_HOSTS, value: "localhost,ubuntu03,ubuntu04,agent-link,hub,hub.agent-link,hub.agent-link.svc.cluster.local"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: HOME, value: /tmp}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: code, configMap: {name: hub-code}}
        - {name: data, persistentVolumeClaim: {claimName: data}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: agent-link
spec:
  type: NodePort
  selector: {app: agent-link}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30110}
